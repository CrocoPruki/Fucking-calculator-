name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codespace-*

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trading_watch_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare release keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Do not fail the whole build if signing secrets are missing/invalid.
          # The Gradle build will fall back to debug signing when the keystore file isn't present.
          mkdir -p android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/ci-release.jks || {
            echo "WARNING: Failed to decode ANDROID_KEYSTORE_BASE64; continuing without release signing."
            rm -f android/ci-release.jks
            exit 0
          }

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/trading_watch_app/android/ci-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: trading_watch_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
